{% extends "base.html" %}

{% block title %}Changer mon mot de passe{% endblock %}
{% block page_title %}Changer mon mot de passe{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "utilisateurs/_formulaire.html" %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Enregistrer le mot de passe</button>
                        <a class="btn btn-outline-secondary" href="{% url 'accueil' %}">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
